<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-label="Ovo Okpubuluku, Senior AI Engineer and Technical Lead">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060E1F"/>
      <stop offset="0.55" stop-color="#0B1D3A"/>
      <stop offset="1" stop-color="#0A4FA6"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.4" r="0.45">
      <stop offset="0" stop-color="#1E90FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1E90FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1E90FF" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .node{fill:#7CC4FF}
      .pulse{animation:p 3s ease-in-out infinite}
      .pulse.d1{animation-delay:.6s}.pulse.d2{animation-delay:1.2s}.pulse.d3{animation-delay:1.8s}.pulse.d4{animation-delay:2.4s}
      @keyframes p{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>

  <rect width="1200" height="350" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="350" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="350" rx="18" fill="url(#glow)"/>

  <!-- agent graph motif -->
  <g transform="translate(0 15)">
  <g stroke="#7CC4FF" stroke-opacity="0.45" stroke-width="1.5" fill="none">
    <path d="M880 90 L980 150 L1080 95"/>
    <path d="M980 150 L960 240 L1070 225"/>
    <path d="M880 90 L860 190 L960 240"/>
    <path d="M1080 95 L1070 225"/>
  </g>
  <circle class="node pulse" cx="880" cy="90" r="7"/>
  <circle class="node pulse d1" cx="980" cy="150" r="11"/>
  <circle class="node pulse d2" cx="1080" cy="95" r="7"/>
  <circle class="node pulse d3" cx="960" cy="240" r="8"/>
  <circle class="node pulse d4" cx="860" cy="190" r="6"/>
  <circle class="node pulse d2" cx="1070" cy="225" r="6"/>
  </g>

  <text x="64" y="86" class="m" font-size="16" fill="#7CC4FF" letter-spacing="3">SENIOR AI ENGINEER · TECHNICAL LEAD</text>
  <text x="62" y="150" class="t" font-size="62" font-weight="800" fill="#FFFFFF">Ovo Okpubuluku</text>
  <text x="64" y="194" class="t" font-size="22" fill="#C9DCF5">Production AI for tier-1 Canadian banking &amp; AdTech</text>
  <text x="64" y="230" class="t" font-size="18" font-weight="600" fill="#C9DCF5" textLength="500" lengthAdjust="spacing">Senior Engineer, Tactable</text>
  <text x="64" y="258" class="t" font-size="18" fill="#9FB8D9" textLength="500" lengthAdjust="spacing">FDE Technical Expert (SME), AI Makerspace · Calgary, Alberta</text>

  <rect x="64" y="282" width="476" height="34" rx="17" fill="#1E90FF" fill-opacity="0.15" stroke="#1E90FF" stroke-opacity="0.6"/>
  <text x="84" y="305" class="m" font-size="15" fill="#E6F1FF">$ the industries changed. the discipline didn't.</text>
</svg>
