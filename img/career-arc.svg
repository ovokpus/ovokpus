<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Career arc: Banking operations 2006 to 2013, Energy field leadership 2015 to 2020, Data and AI engineering 2021 to now">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0B1D3A"/>
      <stop offset="1" stop-color="#0A2A55"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2C14E"/>
      <stop offset="0.5" stop-color="#F28C38"/>
      <stop offset="1" stop-color="#1E90FF"/>
    </linearGradient>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    </style>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <text x="48" y="48" class="m" font-size="14" fill="#7CC4FF" letter-spacing="3">CAREER ARC · 15+ YEARS · THREE INDUSTRIES · ONE DISCIPLINE</text>

  <path d="M200 140 L1000 140" stroke="url(#line)" stroke-width="4" stroke-linecap="round"/>

  <!-- Banking -->
  <circle cx="200" cy="140" r="22" fill="#0B1D3A" stroke="#F2C14E" stroke-width="4"/>
  <g transform="translate(200 140)" stroke="#F2C14E" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M-10 -5 L0 -11 L10 -5 Z M-9 -4 V6 M-3 -4 V6 M3 -4 V6 M9 -4 V6 M-11 8 H11"/></g>
  <text x="200" y="98" text-anchor="middle" class="m" font-size="14" fill="#F2C14E">2006 – 2013</text>
  <text x="200" y="192" text-anchor="middle" class="t" font-size="20" font-weight="700" fill="#FFFFFF">Banking Operations</text>
  <text x="200" y="216" text-anchor="middle" class="t" font-size="14" fill="#9FB8D9">FCMB &amp; FirstBank, Nigeria · zero-fraud record</text>

  <!-- Energy -->
  <circle cx="600" cy="140" r="22" fill="#0B1D3A" stroke="#F28C38" stroke-width="4"/>
  <g transform="translate(600 140)" stroke="#F28C38" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M0 -11 C5 -5 8 -1 8 3 A8 8 0 0 1 -8 3 C-8 -1 -5 -5 0 -11 Z M-3 4 A3 3 0 0 0 3 4"/></g>
  <text x="600" y="98" text-anchor="middle" class="m" font-size="14" fill="#F28C38">2015 – 2020</text>
  <text x="600" y="192" text-anchor="middle" class="t" font-size="20" font-weight="700" fill="#FFFFFF">Energy Field Leadership</text>
  <text x="600" y="216" text-anchor="middle" class="t" font-size="14" fill="#9FB8D9">Suncor, Shell, MEG, Enbridge · Alberta</text>

  <!-- Data & AI -->
  <circle cx="1000" cy="140" r="22" fill="#0B1D3A" stroke="#1E90FF" stroke-width="4"/>
  <g transform="translate(1000 140)" stroke="#1E90FF" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="-7" y="-7" width="14" height="14" rx="2"/><path d="M-3 -7 V-11 M3 -7 V-11 M-3 7 V11 M3 7 V11 M-7 -3 H-11 M-7 3 H-11 M7 -3 H11 M7 3 H11"/></g>
  <text x="1000" y="98" text-anchor="middle" class="m" font-size="14" fill="#1E90FF">2021 – NOW</text>
  <text x="1000" y="192" text-anchor="middle" class="t" font-size="20" font-weight="700" fill="#FFFFFF">Data &amp; AI Engineering</text>
  <text x="1000" y="216" text-anchor="middle" class="t" font-size="14" fill="#9FB8D9">ReVisionz → Totogi → TELUS Digital → Tactable</text>
</svg>
