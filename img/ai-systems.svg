<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="What I build: enterprise data, retrieval, agentic workflows, ML inference, production">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060E1F"/>
      <stop offset="0.6" stop-color="#0B1D3A"/>
      <stop offset="1" stop-color="#0A3B7A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.6">
      <stop offset="0" stop-color="#1E90FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1E90FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1E90FF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <style>
      .t{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .card{fill:#0B1D3A;stroke:#1E90FF;stroke-opacity:.55;stroke-width:1.5}
      .ic{fill:none;stroke:#7CC4FF;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
      .icf{fill:#7CC4FF}
      .flow{fill:none;stroke:#1E90FF;stroke-width:2.5;stroke-dasharray:6 8;animation:f 1.6s linear infinite}
      @keyframes f{to{stroke-dashoffset:-28}}
      .h{font-size:18px;font-weight:700;fill:#FFFFFF}
      .s{font-size:13px;fill:#9FB8D9}
    </style>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#grid)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glow)"/>

  <text x="48" y="50" class="m" font-size="14" fill="#7CC4FF" letter-spacing="3">WHAT I BUILD · FROM DATA TO PRODUCTION</text>

  <!-- connectors -->
  <path class="flow" d="M222 170 H258"/>
  <path class="flow" d="M450 170 H486"/>
  <path class="flow" d="M678 170 H714"/>
  <path class="flow" d="M906 170 H942"/>

  <!-- 1 Enterprise data -->
  <rect class="card" x="40" y="88" width="182" height="190" rx="14"/>
  <g transform="translate(131 134)">
    <ellipse class="ic" cx="0" cy="-14" rx="22" ry="8"/>
    <path class="ic" d="M-22 -14 V14 A22 8 0 0 0 22 14 V-14"/>
    <path class="ic" d="M-22 0 A22 8 0 0 0 22 0"/>
  </g>
  <text x="131" y="196" text-anchor="middle" class="t h">Enterprise data</text>
  <text x="131" y="222" text-anchor="middle" class="t s">Hadoop → GCP</text>
  <text x="131" y="242" text-anchor="middle" class="t s">dbt · BigQuery</text>

  <!-- 2 Retrieval -->
  <rect class="card" x="268" y="88" width="182" height="190" rx="14"/>
  <g transform="translate(359 134)">
    <circle class="ic" cx="-4" cy="-4" r="16"/>
    <path class="ic" d="M8 8 L22 22"/>
    <circle class="icf" cx="-10" cy="-8" r="2.5"/><circle class="icf" cx="0" cy="-10" r="2.5"/><circle class="icf" cx="-4" cy="2" r="2.5"/>
  </g>
  <text x="359" y="196" text-anchor="middle" class="t h">Retrieval (RAG)</text>
  <text x="359" y="222" text-anchor="middle" class="t s">Qdrant · embeddings</text>
  <text x="359" y="242" text-anchor="middle" class="t s">millions of documents</text>

  <!-- 3 Agentic workflows -->
  <rect class="card" x="496" y="88" width="182" height="190" rx="14"/>
  <g transform="translate(587 134)">
    <path class="ic" d="M-18 -14 L0 4 L18 -14 M0 4 L0 22"/>
    <circle class="icf" cx="-18" cy="-14" r="6"/><circle class="icf" cx="18" cy="-14" r="6"/>
    <circle class="icf" cx="0" cy="4" r="7"/><circle class="icf" cx="0" cy="22" r="5"/>
  </g>
  <text x="587" y="196" text-anchor="middle" class="t h">Agentic workflows</text>
  <text x="587" y="222" text-anchor="middle" class="t s">LangGraph · LangSmith</text>
  <text x="587" y="242" text-anchor="middle" class="t s">human-in-the-loop</text>

  <!-- 4 ML inference -->
  <rect class="card" x="724" y="88" width="182" height="190" rx="14"/>
  <g transform="translate(815 134)">
    <rect class="ic" x="-16" y="-16" width="32" height="32" rx="4"/>
    <rect class="icf" x="-7" y="-7" width="14" height="14" rx="2"/>
    <path class="ic" d="M-8 -16 V-24 M0 -16 V-24 M8 -16 V-24 M-8 16 V24 M0 16 V24 M8 16 V24 M-16 -8 H-24 M-16 0 H-24 M-16 8 H-24 M16 -8 H24 M16 0 H24 M16 8 H24"/>
  </g>
  <text x="815" y="196" text-anchor="middle" class="t h">ML inference</text>
  <text x="815" y="222" text-anchor="middle" class="t s">ONNX Runtime · Azure ML</text>
  <text x="815" y="242" text-anchor="middle" class="t s">retraining on drift</text>

  <!-- 5 Production -->
  <rect class="card" x="952" y="88" width="208" height="190" rx="14" style="stroke-opacity:1;stroke:#7CC4FF"/>
  <g transform="translate(1056 134)">
    <path class="ic" d="M0 -24 L20 -16 V0 C20 14 10 22 0 26 C-10 22 -20 14 -20 0 V-16 Z"/>
    <path class="ic" d="M-9 1 L-2 8 L10 -6"/>
  </g>
  <text x="1056" y="196" text-anchor="middle" class="t h">In production</text>
  <text x="1056" y="222" text-anchor="middle" class="t s">security review · audit</text>
  <text x="1056" y="242" text-anchor="middle" class="t s">Azure · GCP · AWS</text>

  <text x="600" y="314" text-anchor="middle" class="m" font-size="13" fill="#7CC4FF" letter-spacing="2">TIER-1 CANADIAN BANKING · ADTECH · ENERGY</text>
</svg>
